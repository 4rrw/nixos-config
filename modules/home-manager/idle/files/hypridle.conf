# Locking is noctalia's; hypridle only decides when. Dispatchers go through the
# lua API because hyprland 0.55 evaluates `hyprctl dispatch` arguments as lua.

general {
    lock_cmd = noctalia msg session lock
    before_sleep_cmd = noctalia msg session lock
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ state = "on" })'
}

listener {
    timeout = 300
    on-timeout = noctalia msg session lock
}

# Screen off shortly after locking. Worth having on the C2 specifically, for the
# same burn-in reason the gap randomizer exists.
listener {
    timeout = 420
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ state = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ state = "on" })'
}
