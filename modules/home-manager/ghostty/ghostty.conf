# Font
font-family = Iosevka Nerd Font Mono
font-style = medium
font-size = 12

# Window
# Ghostty must carry its own alpha -- Hyprland's `opacity` window rule fades the
# finished texture but leaves the surface opaque region intact, so decoration.blur
# has nothing to blur through. Stacks with active_opacity/inactive_opacity in
# hypr/looknfeel.lua.
background-opacity = 0.85
window-padding-x = 4
window-padding-y = 4
confirm-close-surface=false
resize-overlay = never

# Cursor stlying
cursor-style = "block"
cursor-style-blink = false
shell-integration-features = no-cursor

# Keyboard bindings
keybind = f11=toggle_fullscreen

# Fix general slowness on hyprland (https://github.com/ghostty-org/ghostty/discussions/3224)
async-backend = epoll
theme = noctalia
